btv_abrir_youtube:
  alias: "BTV: Abrir YouTube"
  icon: mdi:youtube
  mode: single
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "monkey -p com.google.android.youtube.tv -c android.intent.category.LAUNCHER 1"

btv_abrir_app:
  alias: "BTV: Abrir aplicativo"
  icon: mdi:apps
  mode: single
  fields:
    pacote:
      name: Pacote Android
      example: com.netflix.ninja
      required: true
      selector:
        text:
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "monkey -p {{ pacote | regex_replace('[^A-Za-z0-9._]','') }} -c android.intent.category.LAUNCHER 1"

btv_espelhar_tela:
  alias: "BTV: Espelhar tela (abrir AirScreen)"
  icon: mdi:cast
  mode: single
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "input keyevent 224"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "monkey -p com.ionitech.airscreen -c android.intent.category.LAUNCHER 1"

btv_digitar:
  alias: "BTV: Digitar texto"
  icon: mdi:keyboard
  mode: queued
  fields:
    texto:
      name: Texto
      description: Letras, números e . , @ _ - (sem acentos)
      selector:
        text:
  sequence:
    - variables:
        t: "{{ (texto | default('')) | regex_replace('[^A-Za-z0-9 .,@_-]','') | replace(' ','%s') }}"
    - condition: template
      value_template: "{{ t | length > 0 }}"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "input text '{{ t }}'"

btv_instalar_apk:
  alias: "BTV: Instalar APK"
  icon: mdi:android
  mode: single
  description: >-
    O arquivo precisa estar em /config/www/apks (ou em outra pasta liberada em
    allowlist_external_dirs). NÃO exponha este script à voz e só instale APKs que você conferiu.
  fields:
    arquivo:
      name: Arquivo APK
      example: app.apk
      required: true
      selector:
        text:
  sequence:
    - variables:
        nome: "{{ (arquivo | string | trim).split('/')[-1] | regex_replace('[^A-Za-z0-9._-]','_') }}"
        caminho: "{{ '/config/www/apks/' ~ nome }}"
    - condition: template
      value_template: "{{ nome.lower().endswith('.apk') and nome | length > 4 }}"
    - action: androidtv.upload
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        device_path: "/sdcard/Download/{{ nome }}"
        local_path: "{{ caminho }}"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "pm install -r /sdcard/Download/{{ nome }}"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "rm /sdcard/Download/{{ nome }}"
    - action: persistent_notification.create
      data:
        title: "BTV: Instalar APK"
        message: "Pedido de instalação enviado. O HA não recebe o resultado: confira na lista de apps da caixa."
