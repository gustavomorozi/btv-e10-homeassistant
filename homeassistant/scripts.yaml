# Scripts do BTV E10 no Home Assistant (ADB). Troque media_player.android_tv_192_168_1_50 pela sua entidade.
# Cole em scripts.yaml (ou crie cada script na interface em modo YAML).

btv_voltar_inicio:
  alias: "BTV: Início"
  icon: mdi:home
  mode: single
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_1_50
      data:
        command: "sendevent /dev/input/event1 1 102 1; sendevent /dev/input/event1 0 0 0; sendevent /dev/input/event1 1 102 0; sendevent /dev/input/event1 0 0 0"

